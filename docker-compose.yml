services:
  postgres:
    image: postgres:16
    container_name: waitless_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: waitless
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: waitless_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: waitless_events

  redis:
    image: redis:7-alpine
    container_name: waitless_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mongo_data: